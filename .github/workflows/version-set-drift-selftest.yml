name: Version-set drift self-test (temporary)

# Calls the reusable workflow the way a real caller does: by repository path
# pinned to a commit SHA, so job.workflow_sha is that commit.
on:
  push:
    branches: [feat/version-set-drift]

permissions:
  contents: read

jobs:
  default-set-ref:
    uses: kontourai/.github/.github/workflows/version-set-drift.yml@f86628231db52a8c668d23154820ad39db5e38f2
    with:
      repository: kontourai/station
      ref: main
  branch-set-ref:
    uses: kontourai/.github/.github/workflows/version-set-drift.yml@f86628231db52a8c668d23154820ad39db5e38f2
    with:
      repository: kontourai/station
      ref: main
      version-set-ref: f86628231db52a8c668d23154820ad39db5e38f2
