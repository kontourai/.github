name: Version-set drift self-test (temporary)

on:
  push:
    branches: [feat/version-set-drift]

permissions:
  contents: read

jobs:
  station:
    uses: ./.github/workflows/version-set-drift.yml
    with:
      repository: kontourai/station
      ref: main
      version-set-ref: ${{ github.sha }}
  console:
    uses: ./.github/workflows/version-set-drift.yml
    with:
      repository: kontourai/console
      ref: main
      version-set-ref: ${{ github.sha }}
