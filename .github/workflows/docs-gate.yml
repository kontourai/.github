name: Docs gate

# Runs the shared @kontourai/docs-kit gate: manifest, links and anchors,
# reachability, topics, and (on pull requests) scoped freshness against the
# base commit. docs-kit runs from git at a pinned commit, so callers need no
# install step and no npm token.

on:
  workflow_call:
    inputs:
      docs-kit-ref:
        description: Commit of kontourai/docs-kit to run. Defaults to the org-wide pin.
        required: false
        type: string
        default: 27cd43ded8c6e2e591d85d1d65bff31b3ae92e24 # @kontourai/docs-kit v0.5.0
      repository:
        description: >-
          Repository to check out. Empty means the triggering repository. A
          pull_request_target caller passes the pull request's head repository.
        required: false
        type: string
        default: ''
      ref:
        description: >-
          Commit to check out. Empty means the triggering commit. A
          pull_request_target caller passes the pull request's head SHA, so the
          gate reads the change instead of the base branch. docs-kit only reads
          the checked-out files; it never runs code from them.
        required: false
        type: string
        default: ''
      advisory-freshness:
        description: Report stale documents without failing the gate.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docs-gate:
    name: Docs gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          # docs-kit runs from git with npx; there is no lockfile to cache.
          package-manager-cache: false
      - name: Run docs-kit check
        env:
          DOCS_KIT_REF: ${{ inputs.docs-kit-ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          ADVISORY: ${{ inputs.advisory-freshness }}
        run: |
          args=(check)
          # Freshness needs a base (pull requests and merge-queue entries);
          # pushes to main check everything else.
          # --advisory only qualifies freshness, which needs a base, so both
          # are added together; docs-kit refuses --advisory on its own.
          if [ -n "$BASE_SHA" ]; then
            args+=(--base "$BASE_SHA")
            if [ "$ADVISORY" = "true" ]; then args+=(--advisory); fi
          fi
          # Run npx outside the checkout with npm configuration isolated: a
          # pull_request_target caller checks out pull-request files, and an
          # .npmrc there must not steer how docs-kit is fetched or run. docs-kit
          # only reads the checkout through --root.
          root="$GITHUB_WORKSPACE"
          user_npmrc="$RUNNER_TEMP/docs-gate-user.npmrc"
          global_npmrc="$RUNNER_TEMP/docs-gate-global.npmrc"
          : > "$user_npmrc"
          : > "$global_npmrc"
          cd "$RUNNER_TEMP"
          NPM_CONFIG_USERCONFIG="$user_npmrc" NPM_CONFIG_GLOBALCONFIG="$global_npmrc" \
            npx -y "github:kontourai/docs-kit#${DOCS_KIT_REF}" "${args[@]}" --root "$root"
