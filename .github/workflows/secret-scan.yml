name: Secret Scan

# Single normative secret-scanning gate for the Kontour suite (Hachure principle:
# defined once here, consumed by every repo). A caller wires it in with:
#
#   jobs:
#     secret-scan:
#       uses: kontourai/.github/.github/workflows/secret-scan.yml@main
#       permissions:
#         contents: read
#
# Scope = git-tracked history only. Gitignored runtime/cache files (.env,
# .telemetry/*.jsonl, .npm-pack-cache, ...) are never scanned — so the gate flags
# secrets that entered (or are entering) version control, where exposure is real,
# and does NOT cry wolf about a gitignored local .env. That scoping IS the triage
# policy. Findings are redacted in logs; any finding fails the gate.

on:
  workflow_call:
    inputs:
      fetch-depth:
        description: "Git history depth to scan (0 = full history)."
        type: number
        default: 0
      gitleaks-version:
        description: "Pinned gitleaks release to run."
        type: string
        default: "8.30.1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: ${{ inputs.fetch-depth || 0 }}

      - name: Install gitleaks (OSS binary — no org license required)
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version || '8.30.1' }}
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: |
          set -euo pipefail
          # `git` mode scans tracked commit history; gitignored files are excluded.
          # --redact keeps any matched secret out of the workflow logs.
          gitleaks git . --redact --no-banner --verbose
