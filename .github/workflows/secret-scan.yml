name: Secret Scan

# Single normative secret-scanning gate for the Kontour suite (Hachure principle:
# defined once here, consumed by every repo). A caller wires it in with:
#
#   jobs:
#     secret-scan:
#       uses: kontourai/.github/.github/workflows/secret-scan.yml@<full-commit-sha>
#       with:
#         runner: '["self-hosted","Linux","X64","kontour-linux"]'
#         capacity-coordination-root: /mnt/e/kontour-runner-capacity
#         capacity-host-id: desktop-win
#       permissions:
#         contents: read
#
# Scope = git-tracked history reachable from the checked-out ref only. Gitignored
# runtime/cache files (.env, .telemetry/*.jsonl, .npm-pack-cache, ...) are never
# scanned. Checkout is always full history (fetch-depth: 0, not caller-configurable)
# because gitleaks needs complete reachable history to walk; a shallow checkout
# would silently under-scan. A guard fails the run closed if the checkout is ever
# shallow instead of scanning a partial history. With full history, checkout may
# also retain other remote refs; gitleaks' default `--all` history walk would
# incorrectly attribute their findings to this run. The explicit HEAD log revision
# preserves complete reachable history without scanning unrelated branches.
# Findings are redacted in logs; any finding fails the gate.

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: "Pinned gitleaks release to run."
        type: string
        default: "8.30.1"
      runner:
        description: "JSON runner label or label array; persistent runners still require runner-group authorization."
        type: string
        default: '"ubuntu-latest"'
      capacity-coordination-root:
        description: "Absolute shared coordination root; required for self-hosted runners."
        type: string
        default: ""
      capacity-host-id:
        description: "Stable physical-host identity; required for self-hosted runners."
        type: string
        default: ""
      capacity-units:
        description: "Total capacity units shared by all runners on the physical host."
        type: number
        default: 10
      capacity-lease-weight:
        description: "Capacity units reserved by this scan."
        type: number
        default: 1
      capacity-timeout-seconds:
        description: "Maximum wait for a capacity lease (capped at 600 to preserve scan time)."
        type: number
        default: 600
      capacity-owner-lifetime-seconds:
        description: "Shared physical-host owner lifetime. It is fixed at 6000 seconds for the Station 90-minute timeout plus margin."
        type: number
        default: 6000
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ fromJSON(inputs.runner || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - name: Require capacity coordination on self-hosted runners
        if: runner.environment == 'self-hosted' && (inputs.capacity-coordination-root == '' || inputs.capacity-host-id == '' || inputs.capacity-timeout-seconds > 600 || inputs.capacity-owner-lifetime-seconds != 6000)
        run: |
          echo "Self-hosted secret scans must configure shared physical-host capacity with a wait no longer than 600 seconds and the shared 6000-second owner lifetime." >&2
          exit 1

      - name: Reserve physical host capacity
        if: runner.environment == 'self-hosted'
        uses: kontourai/.github/actions/physical-host-capacity@d996ff0496c9e11b27a0a8643c160eb73e0cf142
        with:
          coordination-root: ${{ inputs.capacity-coordination-root }}
          host-id: ${{ inputs.capacity-host-id }}
          capacity-units: ${{ inputs.capacity-units }}
          lease-weight: ${{ inputs.capacity-lease-weight }}
          timeout-seconds: ${{ inputs.capacity-timeout-seconds }}
          owner-lifetime-seconds: ${{ inputs.capacity-owner-lifetime-seconds }}

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed if checkout is shallow
        run: |
          set -euo pipefail
          # `set -e` does not apply to a command substitution used directly
          # inside an `if` test condition, so a failing `git rev-parse` there
          # would print nothing, be swallowed, and silently be treated as
          # "not shallow" instead of aborting the run. Capturing the output
          # in a plain assignment first makes a git failure an ordinary
          # command failure that `set -e` catches. Comparing against the
          # sole expected value `false` (instead of checking for `true`)
          # also rejects empty output and any other unexpected value, not
          # just an explicit `true`.
          shallow="$(git rev-parse --is-shallow-repository)"
          if [ "${shallow}" != "false" ]; then
            echo "Checkout is shallow or its state could not be determined (got '${shallow}'); the secret scan requires complete history to avoid under-scanning. Refusing to run." >&2
            exit 1
          fi

      - name: Install gitleaks (OSS binary — no org license required)
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version || '8.30.1' }}
        run: |
          set -euo pipefail
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive_name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          mkdir -p "$install_dir"
          curl -sSfL "$release_url/$archive_name" -o "$install_dir/$archive_name"
          curl -sSfL "$release_url/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$install_dir/checksums.txt"
          expected="$(awk -v archive="$archive_name" '$2 == archive { print $1 }' "$install_dir/checksums.txt")"
          if ! printf '%s' "$expected" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "Published checksum for $archive_name is missing or malformed." >&2
            exit 1
          fi
          actual="$(sha256sum "$install_dir/$archive_name" | awk '{ print $1 }')"
          if [ "$actual" != "$expected" ]; then
            echo "Checksum mismatch for $archive_name." >&2
            exit 1
          fi
          tar -xzf "$install_dir/$archive_name" -C "$install_dir" gitleaks
          echo "GITLEAKS_BIN=$install_dir/gitleaks" >> "$GITHUB_ENV"
          "$install_dir/gitleaks" version

      - name: Scan git history for secrets
        run: |
          set -euo pipefail
          # In gitleaks v8.30.1, --log-opts replaces the default
          # `git log ... --full-history --all`; HEAD scans every commit
          # reachable from this checkout but excludes unrelated fetched refs.
          # --redact keeps any matched secret out of the workflow logs. The
          # default non-zero findings exit code deliberately fails this gate.
          "$GITLEAKS_BIN" git . --log-opts=HEAD --redact --no-banner --verbose
