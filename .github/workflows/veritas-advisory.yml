name: Veritas advisory governance

on:
  workflow_call:
    inputs:
      require-ready:
        description: Require an actual ready verdict; existing callers remain advisory by default.
        required: false
        type: boolean
        default: false
      install-browser:
        description: Install Chromium when repository evidence includes browser checks.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  readiness:
    name: Advisory readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERITAS_OUTPUT_DIR: ${{ github.workspace }}/.kontourai/veritas/execution/github-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Callers are a mix of pnpm and npm repositories, so the installer is
      # chosen from whichever lockfile the caller actually has. pnpm is set up
      # only for pnpm callers; it reads the version from their packageManager
      # field. SHA-pinned like every other action here.
      - name: Set up pnpm
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install repository dependencies (pnpm)
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        run: pnpm install --frozen-lockfile
      - name: Install repository dependencies (npm)
        if: ${{ hashFiles('pnpm-lock.yaml') == '' && hashFiles('package-lock.json') != '' }}
        run: npm ci
      # A caller with neither lockfile installs nothing, which is the original
      # behaviour and fine for a repository with no dependencies. A caller that
      # HAS a lockfile must not reach the readiness step uninstalled: before
      # this, a pnpm caller matched no condition, the install silently vanished,
      # and the advisory lane still reported.
      - name: Fail if a lockfile is present but nothing was installed
        if: ${{ hashFiles('pnpm-lock.yaml') != '' || hashFiles('package-lock.json') != '' }}
        run: |
          if [ ! -d node_modules ]; then
            echo "A lockfile is present but node_modules is missing: the install step did not run." >&2
            exit 1
          fi
      - name: Install browser evidence dependency
        if: inputs.install-browser
        run: npx playwright install --with-deps chromium
      - name: Install required command-line evidence tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep
      - name: Resolve exact evidence scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Capture actual Veritas readiness
        uses: kontourai/.github/actions/veritas-readiness@d0132e8b8939dd935492a7608d76f49d8721226b
        with:
          base-sha: ${{ steps.scope.outputs.base }}
          head-sha: ${{ steps.scope.outputs.head }}
          require-ready: ${{ inputs.require-ready }}
      - name: Upload Veritas evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veritas-readiness-${{ github.run_id }}
          path: |
            .kontourai/veritas/evidence/
            ${{ env.VERITAS_OUTPUT_DIR }}
          if-no-files-found: warn
