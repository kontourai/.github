name: Bug report
description: Something behaved differently than documented
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: "@kontourai/flow 0.1.19"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: What happened, and the smallest reproduction
      description: Commands plus output beats description. Run files (.flow/, .veritas/, sidecars) are great evidence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
