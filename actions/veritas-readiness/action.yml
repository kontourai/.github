name: Capture Veritas readiness
description: Retain the actual source-bound readiness verdict and full check output.
inputs:
  base-sha:
    required: true
    description: Exact baseline commit.
  head-sha:
    required: true
    description: Exact checked-out source commit.
  require-ready:
    required: false
    default: 'false'
    description: Fail the job on a failed readiness verdict; default remains advisory.
runs:
  using: composite
  steps:
    - name: Install published Veritas
      shell: bash
      run: |
        veritas_package_root="$(mktemp -d "$RUNNER_TEMP/veritas-package.XXXXXX")"
        echo "VERITAS_PACKAGE_ROOT=$veritas_package_root" >> "$GITHUB_ENV"
        echo "VERITAS_INSTALL_EXIT_CODE=unknown" >> "$GITHUB_ENV"
        node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; const root=process.env.VERITAS_OUTPUT_DIR; fs.mkdirSync(root,{recursive:true,mode:0o700}); fs.writeFileSync(path.join(root,"package-install.log"),"",{mode:0o600});'
        install_status=0
        npm install --prefix "$veritas_package_root" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @kontourai/veritas@1.7.6 > "$VERITAS_OUTPUT_DIR/package-install.log" 2>&1 || install_status=$?
        echo "VERITAS_INSTALL_EXIT_CODE=$install_status" >> "$GITHUB_ENV"
        exit "$install_status"
    - name: Capture actual readiness
      if: always()
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        REQUIRE_READY: ${{ inputs.require-ready }}
      run: |
        # Restrict capture permissions explicitly, not the test child's umask.
        umask 022
        node "$GITHUB_ACTION_PATH/run.mjs"
